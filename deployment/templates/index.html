<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Researchly Research Abstract Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #ffffff;
            color: #31333f;
            font-family: "Source Sans 3", "Source Sans Pro", sans-serif;
        }
        .container {
            max-width: 704px;
            margin: 0 auto;
            padding: 60px 16px 40px;
        }
        h1 {
            font-size: 44px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0 0 24px;
        }
        p.description {
            font-size: 16px;
            margin: 0 0 24px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 170px;
            padding: 12px 16px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: #f0f2f6;
            color: #31333f;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #ff4b4b;
        }
        button {
            margin-top: 16px;
            padding: 8px 12px;
            background: #ffffff;
            color: #31333f;
            border: 1px solid rgba(49, 51, 63, 0.2);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            border-color: #ff4b4b;
            color: #ff4b4b;
        }
        h2 {
            font-size: 28px;
            font-weight: 600;
            margin: 40px 0 16px;
        }
        .success, .error {
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
        }
        .success {
            background: rgba(33, 195, 84, 0.1);
            color: #177233;
        }
        .error {
            background: rgba(255, 43, 43, 0.09);
            color: #7d353b;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Researchly Research Abstract Classifier</h1>
        <p class="description">This app classifies research abstracts as either AI-related or classical research.</p>

        <form method="POST" action="{{ url_for('classify') }}">
            <label for="abstract">Enter research abstract:</label>
            <textarea id="abstract" name="abstract" required>{{ abstract or '' }}</textarea>
            <button type="submit">Classify Abstract</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if prediction %}
            <h2>Prediction</h2>
            <div class="success">The abstract is classified as: {{ prediction }}</div>
        {% endif %}
    </div>
</body>
</html>
